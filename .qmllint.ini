# qmllint configuration for Fukushima.
#
# Quickshell ships its QML modules compiled into the `quickshell` binary as Qt
# resources, so there is no on-disk qmldir for qmllint (or qmlls) to read. Every
# Quickshell type therefore looks "unresolved" to the linter. We silence the
# type-resolution family and keep the checks that still work without types:
# syntax, dead code, shadowing, deprecated APIs, and JS foot-guns.
#
# Regenerate the full key list with:  qmllint --write-defaults

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
# --- Silenced: need type info Quickshell does not expose on disk ---
ImportFailure=disable
UnresolvedType=disable
UnresolvedAlias=disable
MissingType=disable
MissingProperty=disable
MissingEnumEntry=disable
IncompatibleType=disable
UncreatableType=disable
RestrictedType=disable
AttachedPropertyReuse=disable
Quick.AttachedPropertyType=disable
StalePropertyRead=disable

# --- Advisory only (pre-existing surface, clean up in Phase 1) ---
# UnqualifiedAccess needs type info to be meaningful; without on-disk Quickshell
# types it fires on every singleton and nested-scope id. Re-enable once we have
# a types story.
UnqualifiedAccess=disable
PreferNonVarProperties=info
UnusedImports=info
Deprecated=info
EqualityTypeCoercion=info
Quick.Anchors=info
# Variants injects `modelData` into its delegate at runtime; qmllint can't see it.
RequiredProperty=disable

# --- Kept as errors: real correctness / JS foot-guns, currently zero in-tree ---
Eval=error
WithStatement=error
AssignmentInCondition=error
VarUsedBeforeDeclaration=error
FunctionUsedBeforeDeclaration=error
UnreachableCode=error
DuplicatePropertyBinding=error
DuplicateImport=error
DuplicatedName=error
AliasCycle=error
InheritanceCycle=error
