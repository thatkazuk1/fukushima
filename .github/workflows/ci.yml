name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: logic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: extractions/setup-just@v2
      - run: just test

  lint:
    name: qmllint
    runs-on: ubuntu-24.04
    # Advisory for now: the runner's Qt is older than the dev machine's, so the
    # warning set can differ. Promote to blocking once validated against a run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install Qt QML dev tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-effects
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - run: just lint
