name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: logic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: extractions/setup-just@v4
      - run: just test

  lint:
    name: qmllint
    # 26.04 ships Qt 6.10, matching the dev machine — 24.04's Qt 6.4 qmllint is
    # too old to parse this project's .qmllint.ini or resolve QtQuick types.
    runs-on: ubuntu-26.04
    # Advisory while the 26.04 runner is in preview; promote to blocking once it
    # has a few green runs behind it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-effects \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtmultimedia
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - run: just lint
